name: deploy-docs

# Production is published to the root of the gh-pages branch (Pages source:
# "Deploy from a branch"). PR previews are published to pr/<number>/ on the
# same branch and removed when the PR is closed.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# Production and preview deploys all push to gh-pages, so serialize them.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        if: github.event.action != 'closed'

      - uses: actions/setup-node@v6
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: github.event.action != 'closed'

      - name: Build (production)
        if: github.event_name == 'push'
        run: npm run build

      - name: Build (PR preview)
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        run: npm run build
        env:
          DOCS_BASE_URL: /docs/pr/${{ github.event.number }}/
          DOCS_NOINDEX: 'true'

      - name: Deploy production
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          # Keep PR previews when production is redeployed.
          clean-exclude: pr/

      # Fork PRs have no write token, so they only get the build check above.
      - name: Deploy / remove PR preview
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: build
          umbrella-dir: pr
          preview-branch: gh-pages
