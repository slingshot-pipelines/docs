name: deploy

# Publishes the production docs to the root of the gh-pages branch when main
# changes (Pages source: "Deploy from a branch"). PR previews live under pr/ on
# the same branch and are managed by the pr and cleanup-pr-preview workflows.

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Production, preview and cleanup runs all push to gh-pages, so serialize them.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          # Keep PR previews when production is redeployed.
          clean-exclude: |
            pr/
